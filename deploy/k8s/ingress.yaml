# https://janus.qube.local.phi1010.com/janus  -> REST API (8088)
# wss://janus.qube.local.phi1010.com/ws       -> WebSocket API (8188)
#
# TLS comes from Traefik's own ACME resolver ("letsencrypt", configured in
# the traefik chart values): no cert-manager, no Secret. Janus' WebSocket
# transport ignores the URL path, so /ws needs no rewrite.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: janus
  namespace: janus
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  ingressClassName: traefik
  rules:
    - host: janus.qube.local.phi1010.com
      http:
        paths:
          - path: /janus
            pathType: Prefix
            backend:
              service:
                name: janus
                port:
                  number: 8088
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: janus
                port:
                  number: 8188
